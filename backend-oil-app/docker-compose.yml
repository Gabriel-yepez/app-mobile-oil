services:
  db:
    image: postgres:16-alpine
    container_name: ruedalo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruedalo
      POSTGRES_PASSWORD: ruedalo
      POSTGRES_DB: ruedalo
    ports: ['5433:5432']  # 5433 en el host: el 5432 lo ocupa un Postgres ajeno al proyecto
    volumes: ['ruedalo-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ruedalo']
      interval: 5s
      retries: 10

  # Bandeja de correo de desarrollo. Recibe todo lo que el backend envía por
  # SMTP y NO lo reenvía a nadie: los códigos de recuperar contraseña se leen
  # en http://localhost:8025. En producción el SMTP apunta al proveedor real
  # (Brevo, Resend, SendGrid…) solo con variables de entorno.
  mail:
    image: axllent/mailpit:latest
    container_name: ruedalo-mail
    restart: unless-stopped
    ports: ['1025:1025', '8025:8025']  # SMTP, bandeja web

volumes:
  ruedalo-pgdata:
