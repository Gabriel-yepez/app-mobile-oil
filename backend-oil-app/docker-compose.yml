services:
  db:
    image: postgres:16-alpine
    container_name: ruedalo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruedalo
      POSTGRES_PASSWORD: ruedalo
      POSTGRES_DB: ruedalo
    ports: ['5433:5432']  # 5433 en el host: el 5432 lo ocupa un Postgres ajeno al proyecto
    volumes: ['ruedalo-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ruedalo']
      interval: 5s
      retries: 10

volumes:
  ruedalo-pgdata:
