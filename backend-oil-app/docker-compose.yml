services:
  db:
    image: postgres:16-alpine
    container_name: ruedalo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruedalo
      POSTGRES_PASSWORD: ruedalo
      POSTGRES_DB: ruedalo
    ports: ['5432:5432']
    volumes: ['ruedalo-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ruedalo']
      interval: 5s
      retries: 10

volumes:
  ruedalo-pgdata:
